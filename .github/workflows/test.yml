name: Test

on:
  # Only for a release (user rule 04.11.2026, as in Teyvat Cartographia): the version tags, main's v<version> and
  # mc26's v<version>+mc26, or by hand.
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the unit tests
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: common/build/reports/tests/test/
