// Rules of every project: Java 25, the library's group, its JAR named with a "v" before the version
// (aacs-v0.1.0+mc26.1.2-fabric.jar; the library's own version has none), the repositories, and a Maven publication
// (aacs-common, aacs-fabric, aacs-neoforge) for the mods that embed it.
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = mod_group_id
// The common JAR is what mods compile their common code against; each loader's file carries the game and the
// loader as build metadata.
version = project.name == 'common' ? "${mod_version}+mc${minecraft_version}" : "${mod_version}+mc${minecraft_version}-${project.name}"

base {
    archivesName = "${mod_id}-${project.name}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()

repositories {
    mavenCentral()
}

tasks.named('jar', Jar) {
    // The released file: aacs-v0.1.0+mc1.21.1-fabric.jar (the Maven artifact keeps the project in its name).
    if (project.name != 'common') archiveBaseName = mod_id
    archiveVersion = "v${project.version}"
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// What differs between the 26.x games sits beside main in src/mc<game>/java (one file per game, the same class name),
// so `-Pmc=26.2` compiles main with src/mc26.2/java (see settings.gradle).
sourceSets.main.java.srcDir("src/mc${minecraft_version}/java")
// and the folders some of them share (version_sources: glfw for 26.1.2 and 26.2, sdl for 26.3)
"${findProperty('version_sources') ?: ''}".split(',')*.trim().findAll().each { sourceSets.main.java.srcDir("src/$it/java") }

// Classes a game moved to another package (26.3: blaze3d's GPU API to com.mojang.renderpearl): versions/<game>.renames
// lists "old.package.Name new.package.Name" per line, and main is compiled from a copy with those names swapped.
def renames = rootProject.file("versions/${minecraft_version}.renames")
if (renames.exists()) {
    def pairs = renames.readLines().findAll { it.trim() && !it.trim().startsWith('#') }.collect { it.trim().split(/\s+/) }
    def renameSources = tasks.register('renameSources', Sync) {
        from 'src/main/java'
        into layout.buildDirectory.dir('renamedSources/java')
        inputs.file renames
        filteringCharset = 'UTF-8'
        filter { String line ->
            pairs.each { p -> line = line.replaceAll(java.util.regex.Pattern.quote(p[0]) + '(?![A-Za-z0-9_])', p[1]) }
            line
        }
    }
    def renamed = layout.buildDirectory.dir('renamedSources/java').get().asFile
    sourceSets.main.java.srcDirs = [renamed] + sourceSets.main.java.srcDirs.findAll { it != file('src/main/java') }
    tasks.named('compileJava') { dependsOn renameSources }
    tasks.named('sourcesJar') { dependsOn renameSources }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            version = project.version
            from components.java
        }
    }
    // Local Maven (~/.m2) for now: `gradlew publishToMavenLocal`, then mods take it with mavenLocal().
}
