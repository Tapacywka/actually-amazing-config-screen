// Rules of every project: Java 21, the library's group, its JAR named with a "v" before the version
// (aacs-v0.1.0+mc1.21.1-fabric.jar; the library's own version has none), the repositories, and a Maven publication
// (aacs-common, aacs-fabric, aacs-neoforge) for the mods that embed it.
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = mod_group_id
// The common JAR is what mods compile their common code against; each loader's file carries the game and the
// loader as build metadata.
version = project.name == 'common' ? "${mod_version}+mc${minecraft_version}" : "${mod_version}+mc${minecraft_version}-${project.name}"

base {
    archivesName = "${mod_id}-${project.name}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'ParchmentMC'
                url = 'https://maven.parchmentmc.org/'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
}

tasks.named('jar', Jar) {
    // The released file: aacs-v0.1.0+mc1.21.1-fabric.jar (the Maven artifact keeps the project in its name).
    if (project.name != 'common') archiveBaseName = mod_id
    archiveVersion = "v${project.version}"
    from(rootProject.file('LICENSE')) { rename { "LICENSE_${mod_id}" } }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            version = project.version
            from components.java
        }
    }
    // Local Maven (~/.m2) for now: `gradlew publishToMavenLocal`, then mods take it with mavenLocal().
}
