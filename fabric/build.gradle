plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

// A small mod of the development game only (fabric/src/testmod): the settings screen with every kind of row, opened
// from Mod Menu; not in the JAR.
sourceSets {
    testmod {
        java.srcDir rootProject.file('common/src/testmod/java')
        resources.srcDir rootProject.file('common/src/testmod/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

// The class tweaker as the game names its classes: the game's renames applied (26.3 moved blaze3d's GPU API to
// com.mojang.renderpearl, versions/<game>.renames), for Loom in build/ and in the JAR by processResources.
def classTweaker = file('src/main/resources/aacs.classtweaker')
def gameRenames = rootProject.file("versions/${minecraft_version}.renames")
if (gameRenames.exists()) {
    // "old.package.Name new.package.Name" per line, as the class tweaker writes them: old/package/Name
    def pairs = gameRenames.readLines().findAll { it.trim() && !it.trim().startsWith('#') }
            .collect { it.trim().split(/\s+/).collect { name -> name.replace('.', '/') } }
    def rename = { String text -> pairs.each { p -> text = text.replace(p[0], p[1]) }; text }
    classTweaker = layout.buildDirectory.file('classtweaker/aacs.classtweaker').get().asFile
    classTweaker.parentFile.mkdirs()
    classTweaker.setText(rename(file('src/main/resources/aacs.classtweaker').getText('UTF-8')), 'UTF-8')
    tasks.named('processResources', ProcessResources) {
        inputs.file gameRenames
        filesMatching('aacs.classtweaker') { filter { String line -> rename(line) } }
    }
}

loom {
    // The fields of the game the library reaches (the same as common/'s access transformer for NeoForge).
    accessWidenerPath = classTweaker
    mods {
        aacs {
            sourceSet sourceSets.main
        }
        aacs_testmod {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            // 1080p, as every check of the screen (GUI 3 there); -Pshots=true: the test mod's shots, then the game closes.
            programArgs '--width', '1920', '--height', '1080'
            if (project.findProperty('shots') == 'true') vmArg '-Daacs.shots=true'
            source sourceSets.testmod
        }
    }
}

// Local development runs, when present; not in the public repository.
if (rootProject.file('devtest-fabric.gradle').exists()) apply from: rootProject.file('devtest-fabric.gradle')

dependencies {
    // Minecraft 26.x ships with Mojang's names: no mappings, no remapping (the JAR is the compiled one).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // The settings buttons in Mod Menu (AacsModMenu, loaded by Mod Menu only).
    compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // Only for the test mod of the development game.
    // (without the older Fabric Loader they ask for: the main one is on the classpath already)
    testmodImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    testmodImplementation("com.terraformersmc:modmenu:${modmenu_version}") { exclude group: 'net.fabricmc', module: 'fabric-loader' }
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: fabric_minecraft_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Source file names and line numbers, no tables of local variable names: the library has no mixins, the only
    // classes Sinytra Connector needs them in (03.11.2026, about 17 KB less).
    options.debugOptions.debugLevel = 'source,lines'
}
