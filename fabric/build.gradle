plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

// A small mod of the development game only (fabric/src/testmod): the settings screen with every kind of row, opened
// from Mod Menu; not in the JAR.
sourceSets {
    testmod {
        java.srcDir rootProject.file('common/src/testmod/java')
        resources.srcDir rootProject.file('common/src/testmod/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

repositories {
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

loom {
    createRemapConfigurations(sourceSets.testmod)
    mods {
        aacs {
            sourceSet sourceSets.main
        }
        aacs_testmod {
            sourceSet sourceSets.testmod
        }
    }
    runs {
        client {
            // 1080p, as every check of the screen (GUI 3 there); -Pshots=true: the test mod's shots, then the game closes.
            programArgs '--width', '1920', '--height', '1080'
            if (project.findProperty('shots') == 'true') vmArg '-Daacs.shots=true'
            source sourceSets.testmod
        }
    }
}

// Local development runs, when present; not in the public repository.
if (rootProject.file('devtest-fabric.gradle').exists()) apply from: rootProject.file('devtest-fabric.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    // The settings buttons in Mod Menu (AacsModMenu, loaded by Mod Menu only).
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    // Only for the test mod of the development game.
    modTestmodImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modTestmodImplementation "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    def props = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            minecraft_version_range: fabric_minecraft_range,
    ]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

// The released file is the remapped one, named like the plain JAR (multiloader-common).
tasks.named('remapJar') {
    archiveVersion = "v${project.version}"
}

tasks.withType(JavaCompile).configureEach {
    // Full debug information, as in Teyvat Cartographia: Sinytra Connector's mixin adapter needs the local variable
    // tables when the Fabric JAR runs on NeoForge.
    options.debugOptions.debugLevel = 'source,lines,vars'
}
