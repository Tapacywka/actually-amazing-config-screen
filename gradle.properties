# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment Properties (Minecraft 26.x ships unobfuscated with Mojang's names: no Parchment, no remapping)
minecraft_version=26.1.2
# The game without a loader that common/ is compiled against: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1
# Source folders shared by some of the 26.x games besides src/mc<game>/java (glfw: the GLFW window of 26.1.2 and 26.2).
version_sources=glfw
# NeoForge
minecraft_version_range=[26.1.2]
neo_version=26.1.2.124
neo_version_range=[26.1.2,)
loader_version_range=[4,)
# Fabric
fabric_minecraft_range=~26.1.2
fabric_loader_version=0.20.1
# Fabric API only for the test mod of the development game; Mod Menu also for its buttons (compile only).
fabric_api_version=0.155.3+26.1.2
modmenu_version=18.0.2

## Mod Properties
mod_id=aacs
mod_name=Actually Amazing Config Screen
mod_license=MIT
# The version without the game and loader: each loader's build adds +mc<version>-<loader>.
mod_version=1.0.1-dev.1
mod_group_id=net.tapacywka.aacs
mod_authors=Tapacywka
mod_description=A settings screen library: tabs, sections, smooth scrolling and a preview card for each setting.
