plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    enable {
        version = project.neo_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Local development runs, when present; not in the public repository.
if (rootProject.file('devtest-neoforge.gradle').exists()) apply from: rootProject.file('devtest-neoforge.gradle')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

processResources {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Source file names and line numbers (crash reports still point at the line), no tables of local variable names.
    options.debugOptions.debugLevel = 'source,lines'
}
