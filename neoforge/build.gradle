plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// A small mod of the development game only: a settings screen with every kind of row (not in the JAR).
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    enable {
        version = project.neo_version
    }

    // The test mod of the development game (neoforge/src/testmod): never in the JAR.
    addModdingDependenciesTo(sourceSets.testmod)

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = rootProject.file('run')
            // 1080p, as every check of the screen (GUI 3 there); -Pshots=true: the test mod's shots, then the game closes.
            programArguments.addAll('--width', '1920', '--height', '1080')
            if (project.findProperty('shots') == 'true') systemProperty 'aacs.shots', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        aacs_testmod {
            sourceSet(sourceSets.testmod)
        }
    }
}

// Local development runs, when present; not in the public repository.
if (rootProject.file('devtest-neoforge.gradle').exists()) apply from: rootProject.file('devtest-neoforge.gradle')

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

processResources {
    def props = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : project.version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    // Source file names and line numbers (crash reports still point at the line), no tables of local variable names.
    options.debugOptions.debugLevel = 'source,lines'
}
