modLoader="javafml"
loaderVersion="*"
license="${mod_license}"
issueTrackerURL="https://github.com/Tapacywka/actually-amazing-config-screen/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Tapacywka/actually-amazing-config-screen"
authors="${mod_authors}"
description='''${mod_description}'''
logoFile="aacs.png"
# The square icon of the mod list (NeoForge 26.2 and later; earlier ones read logoFile only)
iconFile="aacs.png"
iconBlur=true

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
